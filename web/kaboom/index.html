<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kaboom — Catch the Bombs</title>

<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kaboom">
<meta name="theme-color" content="#0b0f1e">
<meta name="description" content="A bomber on the roof, three buckets of water, and a lot of bombs. Catch them all.">
<meta name="format-detection" content="telephone=no">
<style>
  :root { --accent: #ffcc4d; --panel: rgba(8,10,24,0.72); }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #0b0f1e; color: #fff;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; touch-action: none;
  }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas#game { display: block; background: #0b0f1e; }

  /* Touch row. Empty on purpose: the iOS wrapper injects its pause button here.
     Dragging anywhere on the playfield moves the buckets. */
  #touch { position: absolute; inset: 0; display: none; pointer-events: none; }
  body.touch #touch { display: block; }
  .tbtn {
    position: absolute; bottom: max(18px, env(safe-area-inset-bottom));
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(255,255,255,0.07); border: 2px solid rgba(255,255,255,0.22);
    color: #fff; font-size: 15px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto; touch-action: none;
  }
  .tbtn:active { background: rgba(255,204,77,0.35); border-color: var(--accent); }

  #overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5,7,18,0.66); padding: 20px; text-align: center;
  }
  #overlay.hidden { display: none; }
  .card {
    max-width: 360px; width: 100%; background: var(--panel);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 18px; padding: 26px 22px;
  }
  h1 { margin: 0 0 4px; font-size: 44px; letter-spacing: 0.08em; color: var(--accent); }
  .tag { margin: 0 0 16px; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(255,255,255,0.55); }
  .card p { margin: 0 0 14px; font-size: 14px; line-height: 1.55; color: rgba(255,255,255,0.78); }
  .big { font-size: 34px; font-weight: 800; color: var(--accent); margin: 4px 0 10px; }
  .btn {
    display: block; width: 100%; margin-top: 10px; padding: 14px 18px; cursor: pointer;
    font: inherit; font-size: 16px; font-weight: 800; letter-spacing: 0.06em;
    border: 0; border-radius: 12px; background: var(--accent); color: #1a1300;
  }
  .btn.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.32); font-weight: 600; font-size: 14px; }
  .btn:hover { filter: brightness(1.08); }
  a.back { color: rgba(255,255,255,0.55); font-size: 12px; text-decoration: none; display: inline-block; margin-top: 14px; }
  a.back:hover { color: var(--accent); }
  .keys { font-size: 12px !important; color: rgba(255,255,255,0.5) !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="touch"><div class="tbtn" id="t-pause" aria-label="Pause" style="left:50%;transform:translateX(-50%)">&#10074;&#10074;</div></div>
  <div id="overlay">
    <div class="card" id="card"></div>
  </div>
</div>

<script>
"use strict";

/* =====================================================================
   KABOOM — tunables live here so the game can be tuned without hunting.
   ===================================================================== */
const W = 480, H = 640;                 // logical playfield; scaled to fit any screen
const CFG = {
  startBuckets: 3,
  maxBuckets: 3,
  extraBucketEvery: 5000,     // points between bonus buckets (capped at maxBuckets)
  maxLevel: 8,                // level also = points per bomb, capped here
  bombsBase: 10,              // bombs in level 1
  bombsPerLevel: 5,           // extra bombs each level after
  gravityBase: 150,           // px/s^2 fall acceleration at level 1
  gravityPerLevel: 22,
  bomberSpeedBase: 130,       // px/s
  bomberSpeedPerLevel: 22,
  dropEveryBase: 0.95,        // seconds between drops at level 1
  dropEveryPerLevel: 0.08,
  dropEveryMin: 0.32,
  bucketSpeed: 620,           // px/s for keyboard / gamepad
  bucketW: 84, bucketH: 16, bucketGap: 14,
};
const GROUND = H - 40;
const BUCKET_Y = H - 150;       // top bucket; extras stack below it
const ROOF_Y = 140;

/* ---------- platform bridge (no-ops on the web) ---------- */
const OC = window.Overclock || { haptic() {}, share() {}, isApp: false };
function haptic(s) { try { OC.haptic(s); } catch (e) {} }

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

/* ---------- state ----------
   gameState is a top-level `let` named and valued like Apex Run's so the iOS
   wrapper (which polls it) shows its pause control with no changes:
   menu | countdown | racing | finished | paused                                */
let gameState = "menu";
let score = 0, best = parseInt(store.get("kaboom.best") || "0", 10) || 0;
let level = 1, buckets = CFG.startBuckets, bonusAt = CFG.extraBucketEvery;
let bombsLeft = 0, caughtThisLevel = 0;
let bombs = [], sparks = [], pops = [];
let bucketX = W / 2, targetX = W / 2;
let bomber = { x: W / 2, dir: 1, turnT: 0, dropT: 1, mouth: 0 };
let phaseT = 0;                  // countdown / explosion timers
let exploding = null;            // { t } while a miss chain-detonation plays
let newBest = false;
let muted = false;

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const card = document.getElementById("card");
let scale = 1, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * scale) + "px";
  canvas.style.height = (H * scale) + "px";
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
}
window.addEventListener("resize", resize);
resize();

if (window.matchMedia("(hover: none) and (pointer: coarse)").matches) document.body.classList.add("touch");

/* ---------- audio: tiny synth, no assets ---------- */
let ac = null, master = null;
function initAudio() {
  if (ac) { if (ac.state === "suspended") ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ac = new AC();
  master = ac.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ac.destination);
}
function tone(freq, dur, type, vol, slideTo, delay) {
  if (!ac || muted) return;
  const t0 = ac.currentTime + (delay || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "square"; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol || 0.15, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol) {
  if (!ac || muted) return;
  const n = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = 900; g.gain.value = vol || 0.35;
  s.buffer = buf; s.connect(f); f.connect(g); g.connect(master); s.start();
}
const sfx = {
  drop()  { tone(520, 0.12, "triangle", 0.06, 380); },
  catch(lv) { tone(440 + lv * 60, 0.09, "square", 0.12, 880 + lv * 60); },
  boom()  { noise(0.7, 0.45); tone(120, 0.5, "sawtooth", 0.2, 30); },
  level() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, "square", 0.12, 0, i * 0.09)); },
  extra() { [784, 988, 1319].forEach((f, i) => tone(f, 0.12, "triangle", 0.14, 0, i * 0.08)); },
  over()  { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.22, "sawtooth", 0.13, 0, i * 0.18)); },
  tick()  { tone(660, 0.07, "square", 0.08); },
};

/* ---------- input ---------- */
const keys = { left: false, right: false };
function bucketsReady() { return gameState === "racing"; }

window.addEventListener("keydown", e => {
  const k = e.key;
  if (k === "ArrowLeft" || k === "a" || k === "A") { keys.left = true; e.preventDefault(); }
  else if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; e.preventDefault(); }
  else if (k === "p" || k === "P" || k === "Escape") { togglePause(); }
  else if (k === "m" || k === "M") { toggleMute(); }
  else if (k === "Enter" || k === " ") {
    e.preventDefault();
    if (gameState === "menu" || gameState === "finished") startGame();
    else if (gameState === "paused") togglePause();
  }
  initAudio();
});
window.addEventListener("keyup", e => {
  const k = e.key;
  if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = false;
  if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
});
window.addEventListener("blur", () => { keys.left = keys.right = false; if (gameState === "racing") togglePause(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && gameState === "racing") togglePause(); });

// Pointer = absolute position. The buckets follow your finger or mouse directly,
// which feels far better than left/right buttons on a phone.
function pointerToX(e) {
  const r = canvas.getBoundingClientRect();
  return (e.clientX - r.left) / r.width * W;
}
canvas.addEventListener("pointerdown", e => { initAudio(); targetX = pointerToX(e); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", e => {
  if (e.pointerType === "mouse" || e.buttons) targetX = pointerToX(e);
});
const tp = document.getElementById("t-pause");
function firePause(e) { e.preventDefault(); e.stopPropagation(); togglePause(); haptic("light"); }
tp.addEventListener("touchstart", firePause, { passive: false });
tp.addEventListener("click", firePause);

let padIndex = null;
window.addEventListener("gamepadconnected", e => { padIndex = e.gamepad.index; });
window.addEventListener("gamepaddisconnected", () => { padIndex = null; });
let padStartLatch = false;
function readPad(dt) {
  if (padIndex === null || !navigator.getGamepads) return;
  const gp = navigator.getGamepads()[padIndex]; if (!gp) return;
  let ax = gp.axes[0] || 0;
  if (gp.buttons[14] && gp.buttons[14].pressed) ax = -1;
  if (gp.buttons[15] && gp.buttons[15].pressed) ax = 1;
  if (Math.abs(ax) > 0.15) targetX += ax * CFG.bucketSpeed * dt;
  const start = (gp.buttons[0] && gp.buttons[0].pressed) || (gp.buttons[9] && gp.buttons[9].pressed);
  if (start && !padStartLatch) {
    if (gameState === "menu" || gameState === "finished") startGame();
    else if (gameState === "paused") togglePause();
  }
  padStartLatch = !!start;
}

/* ---------- game flow ---------- */
function levelBombs(l) { return CFG.bombsBase + (l - 1) * CFG.bombsPerLevel; }
function pointsPerBomb() { return Math.min(level, CFG.maxLevel); }

function startGame() {
  initAudio();
  score = 0; level = 1; buckets = CFG.startBuckets; bonusAt = CFG.extraBucketEvery; newBest = false;
  targetX = bucketX = W / 2;
  beginLevel();
}
function beginLevel() {
  bombs = []; sparks = []; pops = []; exploding = null;
  bombsLeft = levelBombs(level);
  bomber.x = W / 2; bomber.dir = Math.random() < 0.5 ? -1 : 1; bomber.turnT = 0.8; bomber.dropT = 1.2;
  phaseT = 2.4;
  gameState = "countdown";
  overlay.classList.add("hidden");
}
function togglePause() {
  if (gameState === "racing") { gameState = "paused"; showPause(); }
  else if (gameState === "paused") { gameState = "racing"; overlay.classList.add("hidden"); }
}
function toggleMute() {
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : 0.5;
}

function dropBomb() {
  if (bombsLeft <= 0) return;
  bombsLeft--;
  const L = Math.min(level, 12);
  // Bombs inherit sideways drift from the bomber so they aren't dead-vertical.
  bombs.push({ x: bomber.x, y: ROOF_Y + 34, vy: 60, g: CFG.gravityBase + L * CFG.gravityPerLevel, wob: Math.random() * 6.28 });
  sfx.drop();
}

function catchBomb(b) {
  score += pointsPerBomb();
  caughtThisLevel++;
  sfx.catch(Math.min(level, 8));
  for (let i = 0; i < 8; i++) sparks.push({ x: b.x, y: BUCKET_Y, vx: (Math.random() - 0.5) * 220, vy: -Math.random() * 220 - 40, t: 0.45, c: "#7fd4ff" });
  if (score >= bonusAt) {
    bonusAt += CFG.extraBucketEvery;
    if (buckets < CFG.maxBuckets) { buckets++; sfx.extra(); haptic("medium"); pops.push({ text: "EXTRA BUCKET", t: 1.2 }); }
  }
  if (score > best) {
    if (!newBest && best > 0) pops.push({ text: "NEW BEST", t: 1.2 });
    best = score; newBest = true;
  }
}

function missBomb() {
  // The Atari rule: one miss detonates *everything* on screen and costs a bucket.
  exploding = { t: 1.3 };
  bombs.forEach(b => {
    for (let i = 0; i < 22; i++) {
      const a = Math.random() * 6.28, s = 60 + Math.random() * 260;
      sparks.push({ x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0.5 + Math.random() * 0.6, c: Math.random() < 0.5 ? "#ffcc4d" : "#ff5a3c" });
    }
  });
  bombs = [];
  buckets--;
  sfx.boom(); haptic("heavy");
}

function levelDone() {
  level++;
  sfx.level(); haptic("medium");
  pops.push({ text: "LEVEL " + level, t: 1.6 });
  beginLevelSoft();
}
function beginLevelSoft() {
  // Same as beginLevel but keeps the celebratory pop text alive.
  const keep = pops.slice();
  beginLevel();
  pops = keep;
  phaseT = 2.0;
}

function gameOver() {
  gameState = "finished";
  if (newBest) { store.set("kaboom.best", String(best)); haptic("success"); } else haptic("error");
  sfx.over();
  showGameOver();
}

/* ---------- update ---------- */
function update(dt) {
  readPad(dt);

  // buckets: keyboard drives the target, pointer sets it directly; always ease toward it
  if (keys.left)  targetX -= CFG.bucketSpeed * dt;
  if (keys.right) targetX += CFG.bucketSpeed * dt;
  targetX = Math.max(CFG.bucketW / 2, Math.min(W - CFG.bucketW / 2, targetX));
  const k = 1 - Math.pow(0.0001, dt);           // fast, frame-rate-independent smoothing
  bucketX += (targetX - bucketX) * k;

  // particles / popups always animate
  sparks.forEach(p => { p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 600 * dt; });
  sparks = sparks.filter(p => p.t > 0);
  pops.forEach(p => p.t -= dt);
  pops = pops.filter(p => p.t > 0);
  bomber.mouth = Math.max(0, bomber.mouth - dt * 4);

  if (gameState === "countdown") {
    const before = Math.ceil(phaseT);
    phaseT -= dt;
    if (Math.ceil(phaseT) !== before && phaseT > 0) sfx.tick();
    if (phaseT <= 0) gameState = "racing";
    return;
  }
  if (gameState !== "racing") return;

  // chain detonation in progress: freeze the action, then resolve
  if (exploding) {
    exploding.t -= dt;
    if (exploding.t <= 0) {
      exploding = null;
      if (buckets <= 0) { gameOver(); return; }
      bomber.dropT = 1.2;
    }
    return;
  }

  // bomber patrols the roof; speeds up each level and reverses at random
  const L = Math.min(level, 12);
  const sp = CFG.bomberSpeedBase + L * CFG.bomberSpeedPerLevel;
  bomber.x += bomber.dir * sp * dt;
  bomber.turnT -= dt;
  if (bomber.x < 40) { bomber.x = 40; bomber.dir = 1; }
  if (bomber.x > W - 40) { bomber.x = W - 40; bomber.dir = -1; }
  if (bomber.turnT <= 0) { if (Math.random() < 0.55) bomber.dir *= -1; bomber.turnT = 0.5 + Math.random() * 0.9; }

  bomber.dropT -= dt;
  if (bomber.dropT <= 0 && bombsLeft > 0) {
    dropBomb(); bomber.mouth = 1;
    bomber.dropT = Math.max(CFG.dropEveryMin, CFG.dropEveryBase - L * CFG.dropEveryPerLevel) * (0.75 + Math.random() * 0.5);
  }

  // bombs fall; the top bucket does the catching, extras are spares underneath
  for (let i = bombs.length - 1; i >= 0; i--) {
    const b = bombs[i];
    const prevY = b.y;
    b.vy += b.g * dt; b.y += b.vy * dt; b.wob += dt * 12;
    // Swept test: a fast bomb can jump the whole catch zone in one frame.
    const topY = BUCKET_Y;
    if (b.y >= topY - 6 && prevY <= topY + CFG.bucketH && Math.abs(b.x - bucketX) < CFG.bucketW / 2 + 6) {
      bombs.splice(i, 1); catchBomb(b); continue;
    }
    if (b.y >= GROUND - 6) { missBomb(); return; }
  }

  if (bombsLeft === 0 && bombs.length === 0 && !exploding) levelDone();
}

/* ---------- drawing ---------- */
function drawBomber() {
  const x = bomber.x, y = ROOF_Y - 6;
  ctx.fillStyle = "#1c1c26"; ctx.fillRect(x - 22, y - 26, 44, 44);                 // striped shirt block
  ctx.fillStyle = "#e9e9ef"; for (let i = 0; i < 4; i++) ctx.fillRect(x - 22, y - 20 + i * 10, 44, 4);
  ctx.fillStyle = "#f0c9a0"; ctx.fillRect(x - 15, y - 52, 30, 28);                  // face
  ctx.fillStyle = "#222"; ctx.fillRect(x - 17, y - 56, 34, 9);                      // hat
  ctx.fillStyle = "#222"; ctx.fillRect(x - 9, y - 42, 4, 4); ctx.fillRect(x + 5, y - 42, 4, 4);  // eyes
  ctx.fillStyle = "#6b3a1d"; ctx.fillRect(x - 15, y - 34, 30, 5);                   // moustache-ish brow band
  ctx.fillStyle = "#401010";
  const m = 4 + bomber.mouth * 9; ctx.fillRect(x - 7, y - 30, 14, m);               // mouth opens on a drop
}

function drawBomb(b) {
  ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(b.x, b.y, 12, 0, 6.283); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.beginPath(); ctx.arc(b.x - 4, b.y - 4, 3.5, 0, 6.283); ctx.fill();
  ctx.fillStyle = "#777"; ctx.fillRect(b.x - 3, b.y - 17, 6, 6);
  ctx.strokeStyle = "#c89a5a"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(b.x, b.y - 17); ctx.lineTo(b.x + 5, b.y - 22); ctx.stroke();
  ctx.fillStyle = (Math.floor(b.wob) % 2) ? "#ffcc4d" : "#ff7a3c";                  // flickering fuse spark
  ctx.beginPath(); ctx.arc(b.x + 5, b.y - 23, 3.5, 0, 6.283); ctx.fill();
}

function drawBucket(cx, y, spare) {
  const w = CFG.bucketW, h = CFG.bucketH;
  ctx.fillStyle = spare ? "#3d7fb5" : "#58a8e8";
  ctx.beginPath(); ctx.moveTo(cx - w / 2, y); ctx.lineTo(cx + w / 2, y); ctx.lineTo(cx + w / 2 - 8, y + h); ctx.lineTo(cx - w / 2 + 8, y + h); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#a9dcff"; ctx.fillRect(cx - w / 2, y, w, 4);                     // water line
  ctx.strokeStyle = "rgba(0,0,0,0.35)"; ctx.lineWidth = 1.5; ctx.strokeRect(cx - w / 2 + 0.5, y + 0.5, w - 1, h - 1);
}

function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);

  // sky + city
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#1d2450"); g.addColorStop(1, "#0b0f1e");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(255,255,255,0.05)";
  for (let i = 0; i < 9; i++) { const bh = 90 + ((i * 53) % 110); ctx.fillRect(i * 56, GROUND - bh, 44, bh); }

  // chain-detonation flash
  let shake = 0;
  if (exploding) {
    shake = exploding.t * 6;
    ctx.save(); ctx.fillStyle = "rgba(255,120,60," + Math.min(0.35, exploding.t * 0.4) + ")"; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
  ctx.save();
  if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // roof + ground
  ctx.fillStyle = "#2a2f55"; ctx.fillRect(0, ROOF_Y + 12, W, 10);
  ctx.fillStyle = "#14172e"; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = "#ff5a3c"; ctx.fillRect(0, GROUND, W, 2);

  drawBomber();
  bombs.forEach(drawBomb);

  // buckets: top one catches, spares stack below it
  for (let i = 0; i < buckets; i++) drawBucket(bucketX, BUCKET_Y + i * (CFG.bucketH + CFG.bucketGap), i > 0);

  sparks.forEach(p => { ctx.globalAlpha = Math.max(0, Math.min(1, p.t * 2)); ctx.fillStyle = p.c; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); });
  ctx.globalAlpha = 1;
  ctx.restore();

  // HUD
  const top = 26;
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#fff"; ctx.font = "800 30px 'Segoe UI', system-ui, sans-serif"; ctx.textAlign = "left";
  ctx.fillText(String(score).padStart(5, "0"), 16, top + 10);
  ctx.font = "600 12px 'Segoe UI', system-ui, sans-serif"; ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.fillText("BEST " + best + (muted ? "  · MUTED" : ""), 16, top + 28);
  ctx.textAlign = "right"; ctx.fillStyle = "#ffcc4d"; ctx.font = "800 18px 'Segoe UI', system-ui, sans-serif";
  ctx.fillText("LEVEL " + level, W - 16, top + 8);
  ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.font = "600 12px 'Segoe UI', system-ui, sans-serif";
  ctx.fillText(bombsLeft + bombs.length + " BOMBS LEFT  ·  " + pointsPerBomb() + " PT EACH", W - 16, top + 28);

  // countdown / popups
  ctx.textAlign = "center";
  if (gameState === "countdown") {
    ctx.fillStyle = "#fff"; ctx.font = "800 72px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText(phaseT > 0.4 ? String(Math.ceil(phaseT - 0.4)) || "GO" : "GO!", W / 2, H / 2 - 20);
  }
  pops.forEach(p => {
    ctx.globalAlpha = Math.min(1, p.t * 2); ctx.fillStyle = "#ffcc4d"; ctx.font = "800 34px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText(p.text, W / 2, H / 2 - 90 - (1.6 - p.t) * 14);
  });
  ctx.globalAlpha = 1;
}

/* ---------- menus ---------- */
function showMenu() {
  card.innerHTML =
    '<h1>KABOOM</h1><div class="tag">Catch every bomb</div>' +
    '<p>The Mad Bomber is loose on the roof. Slide the buckets under his bombs. Miss one and <b>everything</b> goes off &mdash; and costs you a bucket.</p>' +
    '<p class="keys">Move: ← → / A D, mouse, or drag a finger<br>Pause: P / Esc &nbsp;·&nbsp; Mute: M</p>' +
    (best ? '<div class="tag" style="margin:0">Best ' + best + '</div>' : '') +
    '<button class="btn" id="go">PLAY</button>' +
    '<a class="back" href="../">‹ Back to the arcade</a>';
  overlay.classList.remove("hidden");
  document.getElementById("go").onclick = startGame;
}
function showPause() {
  card.innerHTML =
    '<h1 style="font-size:34px">PAUSED</h1>' +
    '<button class="btn" id="resume">RESUME</button>' +
    '<button class="btn ghost" id="quit">Quit to menu</button>';
  overlay.classList.remove("hidden");
  document.getElementById("resume").onclick = togglePause;
  document.getElementById("quit").onclick = () => { gameState = "menu"; showMenu(); };
}
function showGameOver() {
  card.innerHTML =
    '<h1 style="font-size:34px">GAME OVER</h1>' +
    '<div class="big">' + score + '</div>' +
    '<div class="tag">' + (newBest ? "New best score!" : "Best " + best) + ' &nbsp;·&nbsp; Level ' + level + '</div>' +
    '<button class="btn" id="again">PLAY AGAIN</button>' +
    (OC.isApp ? '<button class="btn ghost" id="share">Share score</button>' : '') +
    '<a class="back" href="../">‹ Back to the arcade</a>';
  overlay.classList.remove("hidden");
  document.getElementById("again").onclick = startGame;
  const sh = document.getElementById("share");
  if (sh) sh.onclick = () => OC.share("Scored " + score + " on Kaboom (level " + level + ")!");
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
showMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
